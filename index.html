<!DOCTYPE html>
<html>
<head>
    <title>Edison's Design Portfolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            padding: 20px;
        }
        
        /* This puts the images side-by-side */
        .gallery {
            display: flex;
            justify-content: center;
            flex-wrap: wrap; /* Allows wrapping on smaller screens */
            gap: 30px; /* Space between images */
            margin-top: 30px;
        }

        /* This controls the size and look of the images */
        .gallery img {
            max-width: 400px; /* Makes the images much smaller */
            width: 100%;
            border: 2px solid #ccc;
            box-shadow: 5px 5px 10px rgba(0,0,0,0.1);
            transition: transform 0.3s ease; /* Smooth animation */
            cursor: zoom-in; /* Changes mouse to a magnifying glass */
        }

        /* Hover effect: slightly grow the image when the mouse is over it */
        .gallery img:hover {
            transform: scale(1.05);
            box-shadow: 8px 8px 15px rgba(0,0,0,0.2);
        }

        /* Contact button styling */
        .contact-btn {
            display: inline-block;
            padding: 15px 30px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            font-size: 18px;
            border-radius: 5px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }

        .contact-btn:hover {
            background-color: #0056b3; /* Darkens button on hover */
        }
    </style>
</head>
<body>

    <h1>Welcome to My Design Portfolio</h1>
    <p>Here are some of my recent posters and card models.</p>

    <!-- Gallery Section -->
    <div class="gallery">
        <!-- First Image: Wrapped in a link so clicking it opens the full size -->
        <a href="Untitled-1-01.png" target="_blank" title="Click to expand">
            <img src="Untitled-1-01.png" alt="Design 1">
        </a>
        
        <!-- Second Image -->
        <a href="onevoice-01.png" target="_blank" title="Click to expand">
            <img src="onevoice-01.png" alt="Design 2">
        </a>
    </div>

    <!-- Contact Section -->
    <hr style="width: 50%; margin: 40px auto; border: 1px solid #ccc;">
    <h2>Let's Work Together!</h2>
    <p>If you are interested in my design services, I would love to hear from you.</p>
    
    <a href="mailto:edisonochien24@gmail.com" class="contact-btn">Send Me an Email</a>
    
    <br><br>

</body>
</html>

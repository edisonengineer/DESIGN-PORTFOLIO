<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edison Ochieng | Design Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- PIXIESET STYLE HEADER & NAV -->
    <header>
        <h1 class="logo" onclick="resetToHome()">EDISON.CREATE</h1>
        <nav class="top-nav">
            <button class="nav-link active" onclick="filterMain('all')">All Work</button>
            <button class="nav-link" onclick="filterMain('solidworks')">SolidWorks</button>
            <button class="nav-link" onclick="filterMain('inventor')">Inventor</button>
            <button class="nav-link" onclick="filterMain('graphic')">Graphic Design</button>
            <a href="mailto:edisonochieng@example.com" class="nav-link contact-link">Contact</a>
        </nav>
    </header>

    <main>
        <!-- STATE 1: THE MAIN ALBUM GRID (Thumbnails) -->
        <section id="album-grid" class="view-state active">
            
            <!-- SolidWorks Album Thumbnail -->
            <div class="album-card solidworks" onclick="openHero('EV Battery Cooling Pack', '17TH SEPTEMBER, 2026', 'assets/engineering/ev-cover.jpg')">
                <div class="album-img" style="background-image: url('assets/engineering/ev-cover.jpg');"></div>
                <div class="album-title">EV Battery Cooling Pack</div>
            </div>

            <!-- Inventor Album Thumbnail -->
            <div class="album-card inventor" onclick="openHero('Poultry De-feathering Machine', 'AUGUST, 2026', 'assets/engineering/poultry-cover.jpg')">
                <div class="album-img" style="background-image: url('assets/engineering/poultry-cover.jpg');"></div>
                <div class="album-title">Poultry De-feathering Machine</div>
            </div>

        </section>

        <!-- STATE 2: THE HERO COVER (Like the "Daisy" screen) -->
        <section id="hero-cover" class="view-state hidden">
            <div class="hero-background" id="hero-bg">
                <!-- Overlay content -->
                <div class="hero-content">
                    <h2 id="hero-title">Project Title</h2>
                    <p id="hero-date">DATE / SUBTITLE</p>
                    <button class="view-gallery-btn" onclick="openGallery()">VIEW GALLERY</button>
                </div>
            </div>
        </section>

        <!-- STATE 3: THE INTERNAL GALLERY (After clicking View Gallery) -->
        <section id="internal-gallery" class="view-state hidden">
            
            <!-- Sub-tabs for CAD views (Like Regal, Noir, Bronze) -->
            <nav class="gallery-sub-nav">
                <button class="sub-link active" onclick="filterGallery('isometric')">Isometric</button>
                <button class="sub-link" onclick="filterGallery('front')">Front View</button>
                <button class="sub-link" onclick="filterGallery('side')">Side View</button>
                <button class="sub-link" onclick="filterGallery('top')">Top Plan</button>
            </nav>

            <!-- The Images -->
            <div class="masonry-grid">
                <!-- Isometric Images -->
                <div class="gallery-item isometric oncontextmenu="return false;">
                    <img src="assets/engineering/iso1.jpg" alt="Isometric View">
                </div>
                <!-- Front Images -->
                <div class="gallery-item front" oncontextmenu="return false;">
                    <img src="assets/engineering/front1.jpg" alt="Front View">
                </div>
                <!-- Side Images -->
                <div class="gallery-item side" oncontextmenu="return false;">
                    <img src="assets/engineering/side1.jpg" alt="Side View">
                </div>
            </div>

        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
